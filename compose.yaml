services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sakinah
      POSTGRES_PASSWORD: sakinah_local
      POSTGRES_DB: sakinah
    ports:
      - "5432:5432"
    volumes:
      - sakinah_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakinah -d sakinah"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sakinah_pg: